name: CI

on:
  push:
    branches: [main, test]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        # https://github.com/actions/setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run focused checks
        run: make check

  shell-lint:
    name: Shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        # https://github.com/actions/setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install shell tools
        run: bash scripts/ci/install-tools.bash shell

      - name: Check shell files
        run: bash scripts/ci/lint-files.bash shell

  config-lint:
    name: Config and documentation lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check GitHub Action pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make check-github-action-pins

      - name: Set up Python
        # https://github.com/actions/setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        # https://github.com/actions/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install config tools
        run: bash scripts/ci/install-tools.bash config

      - name: Validate pre-commit config
        run: prek validate-config .pre-commit-config.yaml

      - name: Check workflow security
        run: prek run zizmor --all-files

      - name: Check Python
        run: bash scripts/ci/lint-files.bash python

      - name: Check YAML
        run: >-
          yamllint --strict --config-file config/yamllint.yaml
          .github/workflows/ci.yaml .pre-commit-config.yaml config/yamllint.yaml pre-commit/*.yaml

      - name: Check Markdown
        run: bash scripts/ci/lint-files.bash markdown

      - name: Check TOML
        run: bash scripts/ci/lint-files.bash toml
